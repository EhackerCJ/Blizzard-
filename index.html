<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b1220" />
  <title>BILZZARD — Student Command Center</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="bilzzard-icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 120 120" role="img">
            <defs>
              <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#7aa2ff" />
                <stop offset="100%" stop-color="#47d3c6" />
              </linearGradient>
            </defs>
            <rect x="10" y="10" width="100" height="100" rx="24" fill="url(#g1)" opacity="0.2"/>
            <path d="M28 28h64v14H49l43 50v14H28V92h43L28 42z" fill="url(#g1)"/>
          </svg>
        </div>
        <div>
          <h1>BILZZARD</h1>
          <p>Student Command Center</p>
          <small>Study. Build. Track. Achieve.</small>
        </div>
      </div>
      <nav id="mainNav" class="nav-list"></nav>
      <footer class="sidebar-footer">Made by Ayush Chandra</footer>
    </aside>

    <main class="main-area">
      <header class="topbar card">
        <button id="menuBtn" class="icon-btn">☰</button>
        <div>
          <strong>BILZZARD</strong>
          <span>Study. Build. Track. Achieve.</span>
        </div>
        <button id="globalSearchBtn" class="action-btn">Search (Ctrl+K)</button>
      </header>

      <section id="dashboard" class="section active"></section>
      <section id="planner" class="section"></section>
      <section id="focus" class="section"></section>
      <section id="notes" class="section"></section>
      <section id="quiz" class="section"></section>
      <section id="formula" class="section"></section>
      <section id="codelab" class="section"></section>
      <section id="calculator" class="section"></section>
      <section id="analytics" class="section"></section>
      <section id="achievements" class="section"></section>
      <section id="settings" class="section"></section>
      <section id="about" class="section"></section>

      <footer class="main-footer">BILZZARD © 2026 · Made by Ayush Chandra</footer>
    </main>
  </div>

  <nav class="mobile-bottom" id="mobileBottom"></nav>

  <div id="modalRoot"></div>
  <div id="toastRoot" aria-live="polite" aria-atomic="true"></div>

  <script src="app.js"></script>
</body>
</html>
